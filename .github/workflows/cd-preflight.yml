name: CD preflight (no deployment)

'on':
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-backend]

permissions:
  contents: read

concurrency:
  group: cd-preflight-dev
  cancel-in-progress: false

jobs:
  preflight:
    name: Check AWS access and Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ap-northeast-2
      TF_IN_AUTOMATION: "true"
      BE_REF: ${{ github.event.client_payload.ref }}
      BE_SHA: ${{ github.event.client_payload.sha }}

    steps:
      - name: Check backend dispatch payload
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          if [[ "$BE_REF" != "refs/heads/main" ]]; then
            echo "::error::Backend dispatch must come from main (refs/heads/main)."
            exit 1
          fi
          if [[ ! "$BE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Backend dispatch must include a 40-character commit SHA."
            exit 1
          fi
          echo "Backend commit: $BE_SHA"

      - name: Check out Infra repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and state bucket region
        shell: bash
        run: |
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
          bucket_region=$(aws s3api get-bucket-location \
            --bucket 42voicebridge-tfstate \
            --query LocationConstraint \
            --output text)
          if [[ "$bucket_region" != "$AWS_REGION" ]]; then
            echo "::error::State bucket region is $bucket_region; expected $AWS_REGION."
            exit 1
          fi
          echo "State bucket region: $bucket_region"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/environments/dev

      - name: Initialize S3 backends and validate Terraform layers
        shell: bash
        run: |
          for layer in 1_base 2_storage 3_application; do
            echo "Validating $layer"
            terraform -chdir="infra/environments/dev/$layer" init -reconfigure -lockfile=readonly -input=false
            terraform -chdir="infra/environments/dev/$layer" validate -no-color
          done

      - name: Summarize scope
        shell: bash
        run: |
          {
            echo '## CD preflight passed'
            echo 'AWS credentials, state bucket region, and Terraform configuration were checked.'
            echo 'No Terraform apply or EC2 deployment was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
