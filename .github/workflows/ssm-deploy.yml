name: SSM deploy (manual)

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Check SSM connectivity or deploy BE/AI main commits
        required: true
        type: choice
        options: [check, deploy]
        default: check
      be_sha:
        description: Full 40-character BE main commit SHA (deploy needs be_sha and/or ai_sha)
        required: false
        type: string
      ai_sha:
        description: Full 40-character AI main commit SHA. AI deploys first; if it fails BE is left untouched
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ssm-deploy-dev
  cancel-in-progress: false

jobs:
  ssm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-northeast-2
      TF_IN_AUTOMATION: 'true'
      DEPLOY_MODE: ${{ inputs.mode }}
      BE_SHA: ${{ inputs.be_sha }}
      AI_SHA: ${{ inputs.ai_sha }}
      BE_IMAGE_REPOSITORY: ${{ vars.BE_IMAGE_REPOSITORY }}
      AI_IMAGE_REPOSITORY: ${{ vars.AI_IMAGE_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - name: Check or deploy through SSM
        shell: bash
        run: bash scripts/ssm/run.sh "$DEPLOY_MODE" "$BE_SHA" "$AI_SHA"
