name: Deploy AI image (repository_dispatch)

# AI 저장소 CI가 이미지를 GHCR에 게시한 뒤 보내는 deploy-ai 이벤트를 받아 AI 컨테이너만 교체한다.
# repository_dispatch는 기본 브랜치(main)의 워크플로만 실행한다.
# cd-preflight.yml은 deploy-backend 전용이며 SHA를 BE 커밋으로 검증하므로 이 이벤트와 섞지 않는다.
'on':
  repository_dispatch:
    types: [deploy-ai]

permissions:
  contents: read

# 같은 컴포넌트의 배포만 직렬화한다. 대기 중인 이전 이벤트는 더 최신 이벤트로 대체된다(최신 이미지 우선).
concurrency:
  group: deploy-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-northeast-2
      TF_IN_AUTOMATION: 'true'
      # payload와 변수는 env로만 전달한다(스크립트에 ${{ }}를 직접 넣지 않는다).
      AI_REF: ${{ github.event.client_payload.ref }}
      AI_SHA: ${{ github.event.client_payload.sha }}
      AI_PAYLOAD_IMAGE: ${{ github.event.client_payload.image }}
      AI_IMAGE_REPOSITORY: ${{ vars.AI_IMAGE_REPOSITORY }}
    steps:
      - name: Validate dispatch payload
        shell: bash
        run: |
          if [[ "$AI_REF" != "refs/heads/main" ]]; then
            echo "::error::AI dispatch must come from main (refs/heads/main)."
            exit 1
          fi
          if [[ ! "$AI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::AI dispatch must include a 40-character lowercase commit SHA."
            exit 1
          fi
          if [[ ! "$AI_IMAGE_REPOSITORY" =~ ^ghcr\.io/42voicebridge/[a-z0-9._-]+$ ]]; then
            echo "::error::Repository variable AI_IMAGE_REPOSITORY must be ghcr.io/42voicebridge/<package>."
            exit 1
          fi
          # 이미지 경로는 payload가 아니라 Infra 변수와 SHA로만 조립한다. payload의 image는
          # 설정 불일치를 잡는 확인용이며, 다르면 배포하지 않는다.
          expected="$AI_IMAGE_REPOSITORY:sha-$AI_SHA"
          if [[ -n "$AI_PAYLOAD_IMAGE" && "$AI_PAYLOAD_IMAGE" != "$expected" ]]; then
            echo "::error::Payload image does not match AI_IMAGE_REPOSITORY and sha."
            exit 1
          fi
          echo "AI image: $expected"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - name: Deploy AI container through SSM
        shell: bash
        run: bash scripts/ssm/run.sh deploy "" "$AI_SHA"
